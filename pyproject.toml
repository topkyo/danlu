[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiwiki"
version = "0.4.0"
description = "Local-first knowledge compiler scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "beautifulsoup4>=4.12,<5",
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[project.scripts]
aiwiki = "aiwiki.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiwiki = ["default_prompts/*.md"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "W", "I", "B", "F541", "F821", "F822", "F823", "F841"]
# B905 wants zip(..., strict=); that keyword is Python ≥3.10-only. Obsidian GUI
# PATH often resolves to Apple /usr/bin/python3 (3.9), so we keep plain zip +
# explicit length checks where equality matters.
ignore = ["B905"]

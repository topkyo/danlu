# Pre-commit hooks: lightweight gate only.
# Full verification still requires `bash scripts/verify.sh` (scripts, smoke, acceptance, etc.).
# This hook runs only ruff check/format + basic file checks to keep commits fast.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        name: ruff check
      - id: ruff-format
        name: ruff format check
        args: [--check]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]

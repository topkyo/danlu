[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiwiki"
version = "0.1.0"
description = "Local-first knowledge compiler scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
aiwiki = "aiwiki.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

name: Verify

on:
  push:
    branches:
      - main
      - feat/engineering-nine-plus
  pull_request:
    branches:
      - main
      - feat/engineering-nine-plus

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: .obsidian/plugins/furnace-product-shell/package-lock.json

      - name: Install Python dependencies
        run: pip install -e '.[dev]'

      - name: Install Product Shell npm dependencies
        working-directory: .obsidian/plugins/furnace-product-shell
        run: npm ci

      - name: Run verify (all)
        run: bash scripts/verify.sh all
